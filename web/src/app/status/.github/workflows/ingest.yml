name: Ingest Fingrid data

on:
  schedule:
    - cron: "15 * * * *"   # every hour at minute 15
  workflow_dispatch:        # lets you trigger it by hand from GitHub

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      - name: Fetch Fingrid data
        working-directory: pipeline
        env:
          FINGRID_API_KEY: ${{ secrets.FINGRID_API_KEY }}
        run: python fetch_fingrid.py

      - name: Load to Supabase
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python load_supabase.py
